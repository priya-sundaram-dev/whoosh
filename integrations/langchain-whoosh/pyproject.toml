[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-whoosh"
version = "0.1.0"
description = "A pure-Python BM25 (lexical) retriever for LangChain, powered by Whoosh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Priya Sundaram" }]
keywords = ["langchain", "whoosh", "bm25", "retriever", "search", "lexical", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "langchain-core>=0.3,<1.0",
    "whoosh3>=3.51.0",
]

[project.urls]
Homepage = "https://github.com/priya-sundaram-dev/whoosh"
Source = "https://github.com/priya-sundaram-dev/whoosh/tree/main/integrations/langchain-whoosh"
Issues = "https://github.com/priya-sundaram-dev/whoosh/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_whoosh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
