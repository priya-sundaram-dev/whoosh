[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "langchain-whoosh"
version = "0.1.1"
description = "A pure-Python BM25 (lexical) retriever for LangChain, powered by Whoosh."
readme = "README.md"
keywords = [ "bm25", "langchain", "lexical", "rag", "retriever", "search", "whoosh" ]
license = { text = "BSD-2-Clause" }
authors = [ { name = "Priya Sundaram" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "langchain-core>=0.3,<2",
  "whoosh3>=3.51",
]
optional-dependencies.test = [ "pytest>=7" ]
urls.Homepage = "https://github.com/priya-sundaram-dev/whoosh"
urls.Issues = "https://github.com/priya-sundaram-dev/whoosh/issues"
urls.Source = "https://github.com/priya-sundaram-dev/whoosh/tree/main/integrations/langchain-whoosh"

[tool.hatch]
build.targets.wheel.packages = [ "langchain_whoosh" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
