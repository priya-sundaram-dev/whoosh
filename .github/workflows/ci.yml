name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All jobs only check out and run tests/linters — they never write back to the
# repo, so scope the GITHUB_TOKEN down to read-only for the whole workflow.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 3.15 / 3.15t are still release candidates: run them for early-warning
    # signal, but don't let an upstream RC regression turn main's CI red.
    continue-on-error: ${{ startsWith(matrix.python-version, '3.15') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Stable rows install the integration extras so the langchain/llamaindex/mcp
        # tests actually run instead of skipping.
        extras: [".[langchain,llamaindex,mcp]"]
        include:
          # Free-threaded builds: install base only. The optional integration deps
          # don't ship free-threaded wheels yet, but the pure-Python core must stay
          # green here -- these rows have caught real GIL/threading races before.
          - os: ubuntu-latest
            python-version: "3.14t"
            extras: "."
          - os: ubuntu-latest
            python-version: "3.15t"
            extras: "."
          - os: windows-latest
            python-version: "3.x"
            extras: ".[langchain,llamaindex,mcp]"
          - os: macos-latest
            python-version: "3.x"
            extras: ".[langchain,llamaindex,mcp]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.extras }}"
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  future-proof:
    name: Future-proof (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langchain,llamaindex]"
          python -m pip install pytest
      - name: Run tests with DeprecationWarning promoted to error
        # Guards the "runs clean on modern Python" promise: if a future
        # CPython deprecates something Whoosh relies on, this job fails
        # loudly here instead of silently breaking downstream users.
        run: python -m pytest tests/ -q -W error::DeprecationWarning -W error::PendingDeprecationWarning

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx ruff check

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx pre-commit run --all-files

  types:
    name: Types (mypy smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mypy
      - name: mypy type-check the public-API smoke fixture
        # Type-checks tests/typing_smoke.py (a realistic downstream-usage
        # snippet) against Whoosh's shipped annotations. Guards that the
        # public API stays typed for users' editors and mypy runs (gh#3).
        run: python -m mypy
