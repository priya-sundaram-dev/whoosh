name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All jobs only check out and run tests/linters — they never write back to the
# repo, so scope the GITHUB_TOKEN down to read-only for the whole workflow.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 3.15 / 3.15t are still release candidates: run them for early-warning
    # signal, but don't let an upstream RC regression turn main's CI red.
    continue-on-error: ${{ startsWith(matrix.python-version, '3.15') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Stable rows install the integration extras so the langchain/llamaindex/mcp
        # tests actually run instead of skipping.
        extras: [".[langchain,llamaindex,mcp]"]
        include:
          # Free-threaded builds: install base only. The optional integration deps
          # don't ship free-threaded wheels yet, but the pure-Python core must stay
          # green here -- these rows have caught real GIL/threading races before.
          - os: ubuntu-latest
            python-version: "3.14t"
            extras: "."
          - os: ubuntu-latest
            python-version: "3.15t"
            extras: "."
          - os: windows-latest
            python-version: "3.x"
            extras: ".[langchain,llamaindex,mcp]"
          - os: macos-latest
            python-version: "3.x"
            extras: ".[langchain,llamaindex,mcp]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: |
          uv pip install --system -e "${{ matrix.extras }}"
          uv pip install --system pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  free-threading:
    name: Free-threading race check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.15t is still an RC: keep it as early-warning signal without turning
    # main red on an upstream RC regression. 3.13t is intentionally omitted --
    # free-threading was experimental there, so races it surfaces aren't
    # actionable for us (see gh#146).
    continue-on-error: ${{ matrix.python-version == '3.15t' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-run-parallel
      - name: Run tests under the thread-race detector
        # Runs the pure-Python core across many worker threads to surface
        # data races the GIL used to hide. Tests that mutate shared global or
        # on-disk state directly are marked @pytest.mark.thread_unsafe and run
        # serially; fixture-based thread-unsafety (capsys/monkeypatch/...) is
        # auto-detected by the plugin. See gh#146.
        #
        # We run one concurrent pass (no --iterations): each test executes across
        # many worker threads at once, which is where races surface. --iterations
        # would additionally *re-run* each test in place, which a few
        # legitimately non-idempotent integration tests (e.g. the CLI
        # incremental-index detector, which asserts "1 added" the first time)
        # can't satisfy -- that's a fixture-reuse property, not a data race.
        run: python -m pytest tests/ -q --parallel-threads=auto

  future-proof:
    name: Future-proof (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: |
          uv pip install --system -e ".[langchain,llamaindex]"
          uv pip install --system pytest
      - name: Run tests with DeprecationWarning promoted to error
        # Guards the "runs clean on modern Python" promise: if a future
        # CPython deprecates something Whoosh relies on, this job fails
        # loudly here instead of silently breaking downstream users.
        run: python -m pytest tests/ -q -W error::DeprecationWarning -W error::PendingDeprecationWarning

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx ruff check

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx pre-commit run --all-files

  types:
    name: Types (mypy smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: |
          uv pip install --system -e .
          uv pip install --system mypy
      - name: mypy type-check the public-API smoke fixture
        # Type-checks tests/typing_smoke.py (a realistic downstream-usage
        # snippet) against Whoosh's shipped annotations. Guards that the
        # public API stays typed for users' editors and mypy runs (gh#121).
        run: python -m mypy
