name: Deploy site to GitHub Pages

# Publishes the browser demo (site root) AND the full Sphinx documentation
# (under /docs/) so the docs are live and search-indexable.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "docs/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install docs dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system -r docs/requirements.txt

      - name: Build Sphinx docs
        run: |
          sphinx-build -b html docs/source docs/_build/html

      - name: Build current wheel for the browser demo
        run: |
          uv pip install --system build
          python -m build --wheel
          # Keep the real wheel filename: micropip validates it against PEP 440,
          # so a "latest" pseudo-version is rejected as an invalid wheel name.
          # The real filename is injected into the demo HTML in the next step.
          cp dist/whoosh3-*-none-any.whl demo/

      - name: Assemble site (demo at root, docs under /docs)
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          mkdir -p _site/docs
          cp -r docs/_build/html/. _site/docs/
          # Keep the demo's JSON-LD softwareVersion in sync with the shipped release.
          VERSION="$(python -c 'import whoosh; print(whoosh.__version_str__)')"
          sed -i -E "s#(\"softwareVersion\": \")[^\"]*(\")#\1${VERSION}\2#" _site/index.html
          # Inject the real wheel filename so micropip can install it (PEP 440).
          WHEEL="$(cd dist && ls whoosh3-*-none-any.whl | head -1)"
          echo "Demo wheel: ${WHEEL}"
          sed -i "s#__WHEEL_FILENAME__#${WHEEL}#g" _site/index.html
          # Fail loudly if the placeholder was not replaced (guards the live demo).
          if grep -q "__WHEEL_FILENAME__" _site/index.html; then
            echo "ERROR: __WHEEL_FILENAME__ placeholder was not replaced" >&2
            exit 1
          fi

      - name: Self-heal sitemap (append any built docs pages not yet listed)
        run: |
          python - <<'PY'
          import pathlib, re, datetime
          base = "https://priya-sundaram-dev.github.io/whoosh"
          site = pathlib.Path("_site")
          sm = site / "sitemap.xml"
          text = sm.read_text()
          today = datetime.date.today().isoformat()
          # Collect every built docs HTML page.
          pages = sorted(p.name for p in (site / "docs").glob("*.html"))
          missing = [f"docs/{p}" for p in pages if f"{base}/docs/{p}" not in text]
          if missing:
              entries = "".join(
                  f"  <url>\n"
                  f"    <loc>{base}/{path}</loc>\n"
                  f"    <lastmod>{today}</lastmod>\n"
                  f"    <changefreq>monthly</changefreq>\n"
                  f"    <priority>0.6</priority>\n"
                  f"  </url>\n"
                  for path in missing
              )
              text = text.replace("</urlset>", entries + "</urlset>")
              sm.write_text(text)
              print(f"Added {len(missing)} missing sitemap entries: {missing}")
          else:
              print("Sitemap already complete.")
          PY

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v3.0.2-node.24

      - name: Notify search engines via IndexNow
        # Ping the IndexNow pool (Bing, Yandex, Seznam, DuckDuckGo) with the full
        # URL set from the freshly built sitemap, so updated docs/tutorials get
        # crawled promptly instead of waiting for the next organic recrawl.
        # Key file lives at the site root; ownership is verified by fetching it.
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request
          site = pathlib.Path("_site")
          key_files = sorted(site.glob("*.txt"))
          key = None
          for f in key_files:
              txt = f.read_text().strip()
              if re.fullmatch(r"[0-9a-fA-F]{16,64}", txt) and f.stem == txt:
                  key = txt
                  break
          if not key:
              print("No IndexNow key file found; skipping.")
              raise SystemExit(0)
          sm = (site / "sitemap.xml").read_text()
          urls = re.findall(r"<loc>([^<]+)</loc>", sm)
          host = "priya-sundaram-dev.github.io"
          body = {
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/whoosh/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow submitted {len(urls)} URLs -> HTTP {r.status}")
          except Exception as e:
              print(f"IndexNow ping failed (non-fatal): {e}")
          PY
