name: llama-index-retrievers-whoosh

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "integrations/llama-index-retrievers-whoosh/**"
      - ".github/workflows/llama-index-retrievers-whoosh.yml"
      - "src/whoosh/retrieval.py"
  pull_request:
    paths:
      - "integrations/llama-index-retrievers-whoosh/**"
      - ".github/workflows/llama-index-retrievers-whoosh.yml"
      - "src/whoosh/retrieval.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install whoosh3 from this checkout + the integration package
        working-directory: integrations/llama-index-retrievers-whoosh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../..    # install whoosh3 from the repo root
          python -m pip install -e ".[test]"
      - name: Run tests
        working-directory: integrations/llama-index-retrievers-whoosh
        run: python -m pytest -q
