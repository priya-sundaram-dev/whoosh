name: llama-index-retrievers-whoosh

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "integrations/llama-index-retrievers-whoosh/**"
      - ".github/workflows/llama-index-retrievers-whoosh.yml"
      - "src/whoosh/retrieval.py"
  pull_request:
    paths:
      - "integrations/llama-index-retrievers-whoosh/**"
      - ".github/workflows/llama-index-retrievers-whoosh.yml"
      - "src/whoosh/retrieval.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install whoosh3 from this checkout + the integration package
        working-directory: integrations/llama-index-retrievers-whoosh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../..    # install whoosh3 from the repo root
          python -m pip install -e ".[test]"
      - name: Run tests
        working-directory: integrations/llama-index-retrievers-whoosh
        run: python -m pytest -q
