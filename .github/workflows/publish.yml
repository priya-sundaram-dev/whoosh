name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Default to no GITHUB_TOKEN permissions; each job opts in to only what it needs.
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    # Only needs to read the repo to build the sdist/wheel.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # This is a release-publishing workflow; disable uv's cache so a
          # poisoned cache entry can't influence the artifacts we build and
          # upload to PyPI (flagged by zizmor's cache-poisoning audit).
          enable-cache: false
      - name: Build sdist and wheel
        run: |
          uv pip install --system build
          python -m build
      - name: Check metadata
        run: |
          uv pip install --system twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        # TODO: Use Trusted Publishing and remove PYPI_API_TOKEN and the `zizmor: ignore`.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # zizmor: ignore[use-trusted-publishing] v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
