[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "whoosh3"
description = """\
  Fast, pure-Python full-text indexing, search, and spell-checking library — the actively maintained Whoosh, running \
  on Python 3.10-3.14.\
  """
readme = "README.md"
keywords = [ "bm25", "full-text", "index", "search", "spell", "text" ]
license = "BSD-2-Clause"
maintainers = [
  { name = "Priya Sundaram" },
]
authors = [
  { name = "Matt Chaput", email = "matt@whoosh.ca" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dynamic = [ "version" ]
optional-dependencies.dev = [ "mypy", "pre-commit", "pytest>=7", "pytest-cov", "ruff" ]
optional-dependencies.fastmcp = [ "fastmcp>=2" ]
optional-dependencies.langchain = [ "langchain-core>=0.3" ]
optional-dependencies.llamaindex = [ "llama-index-core>=0.10" ]
# whoosh.mcp supports both official SDK majors (1.x FastMCP and 2.x MCPServer),
# so no upper bound is needed. For the standalone package use the `fastmcp` extra.
optional-dependencies.mcp = [ "mcp>=1" ]
urls.Changelog = "https://github.com/priya-sundaram-dev/whoosh/blob/main/CHANGELOG.md"
urls.Documentation = "https://priya-sundaram-dev.github.io/whoosh/"
urls.Homepage = "https://github.com/priya-sundaram-dev/whoosh"
urls.Issues = "https://github.com/priya-sundaram-dev/whoosh/issues"
urls.Repository = "https://github.com/priya-sundaram-dev/whoosh"
scripts.whoosh = "whoosh.cli:main"
scripts.whoosh-mcp = "whoosh.mcp:main"

[tool.setuptools]
packages.find.where = [ "src" ]
package-dir = { "" = "src" }
package-data.whoosh = [ "py.typed" ]
dynamic.version = { attr = "whoosh.__version_str__" }

# ==========================================================================
# Existing ruff / tooling config preserved below.
# ==========================================================================
[tool.ruff]
target-version = "py310"
lint.select = [
  "AIR",    # Airflow
  "ASYNC",  # flake8-async
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # McCabe cyclomatic complexity
  "DJ",     # flake8-django
  "DTZ",    # flake8-datetimez
  "E",      # pycodestyle
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INT",    # flake8-gettext
  "LOG",    # flake8-logging
  "NPY",    # NumPy-specific rules
  "PD",     # pandas-vet
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PLC",    # Pylint conventions
  "PLE",    # Pylint errors
  "PLR091", # Pylint Refactor just for max-args, max-branches, etc.
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RSE",    # flake8-raise
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # pycodestyle
  "YTT",    # flake8-2020
  # "A",    # flake8-builtins
  # "ANN",  # flake8-annotations
  # "ARG",  # flake8-unused-arguments
  # "B",    # flake8-bugbear
  # "COM",  # flake8-commas
  # "CPY",  # flake8-copyright
  # "D",    # pydocstyle
  # "EM",   # flake8-errmsg
  # "ERA",  # eradicate
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  # "FURB", # refurb
  # "INP",  # flake8-no-pep420
  # "ISC",  # flake8-implicit-str-concat
  # "N",    # pep8-naming
  # "PL",   # Pylint
  # "PT",   # flake8-pytest-style
  # "PTH",  # flake8-use-pathlib
  # "RET",  # flake8-return
  # "RUF",  # Ruff-specific rules
  # "S",    # flake8-bandit
  # "SIM",  # flake8-simplify
  # "SLF",  # flake8-self
  # "T20",  # flake8-print
  # "TD",   # flake8-todos
  # "TRY",  # tryceratops
]
lint.ignore = [
  "BLE001",  # blind `except Exception` is used intentionally around optional features
  # Whoosh's DATETIME field indexes and queries naive datetimes by design; users
  # store tz-naive values and callers control any tz handling. Requiring an explicit
  # tzinfo everywhere would be incorrect for this library's supported data model.
  "DTZ",     # flake8-datetimez (naive datetimes are a supported feature)
  "E501",    # line-length is enforced by ruff format, not ruff check
  "F401",    # unused imports are often used for type-checking or optional features
  "FLY002",
  "PERF203",
  "PIE790",  # Unnecessary `pass` statement
  # Whoosh deliberately uses function-local (lazy) imports throughout to avoid
  # circular imports between tightly-coupled modules and to defer loading of
  # optional/heavy dependencies until they are actually needed. These are an
  # intentional design choice, not a defect, so we do not enforce top-level imports.
  "PLC0415", # `import` should be at the top-level of a file
  "PLR0915", # too-many-statements (only trips a large end-to-end typing test)
  # __enter__ returning the concrete class (IndexReader/IndexWriter) rather than
  # Self is intentional and correct here; forcing `Self` would need `typing.Self`
  # (3.11+) or a version-guarded import for no practical benefit.
  "PYI034",  # __enter__ should return `Self`
  # `re` and typing-only stdlib imports are used at runtime in several modules;
  # moving them into TYPE_CHECKING blocks trades real correctness risk for a
  # marginal import-time saving in a library that already curates its imports.
  "TC003",   # move std-library import into a type-checking block
  "UP031",
]
lint.per-file-ignores."benchmark/enron.py" = [ "PGH003" ]
lint.per-file-ignores."src/whoosh/filedb/filestore.py" = [ "UP024" ]
lint.per-file-ignores."src/whoosh/support/bench.py" = [ "PGH003" ]
lint.mccabe.max-complexity = 45  # Default is 10
lint.pylint.max-args = 22  # Default is 5
lint.pylint.max-branches = 79  # Default is 12
lint.pylint.max-returns = 16  # Default is 6
lint.pylint.max-statements = 256  # Default is 50

# ==========================================================================
# mypy: type-checker smoke config (gh#121).
#
# We do NOT type-check Whoosh's (still largely untyped) internals yet — that
# is tracked incrementally on gh#121. Instead CI type-checks tests/typing_smoke.py,
# a realistic downstream-usage snippet, to guard that the annotations on the
# public API stay present and correct for users' editors and mypy runs.
# ``follow_imports = "silent"`` means mypy still *reads* Whoosh's annotations
# (so the smoke file is genuinely checked against them) but does not report
# errors originating inside the not-yet-fully-typed internal modules.
# ==========================================================================
[tool.mypy]
files = [ "tests/typing_smoke.py" ]
ignore_missing_imports = true
follow_imports = "silent"
# Type-check the public-API smoke fixture against Whoosh3's minimum floor
# (3.10). This sets mypy's *checking target* only.
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ty]
# TODO: Gradual typing: Revisit these ignores and remove them as the codebase is
# incrementally typed (gh#121).  Instance counts are a dated snapshot (ty 0.0.74,
# 2026-09-03) to help contributors pick a tractable rule to clear next; re-run
# `ty check src/whoosh` with a rule flipped to "warn" to get a fresh count.
# Note (gh#121): the two smallest rules are dominated by ty limitations, not real
# bugs -- `missing-argument` is almost entirely bound-method aliasing
# (`f = self.meth; f(...)`) and `not-subscriptable` is Optional attributes set to
# None in __init__ then reassigned.  Clearing those means broad annotation work or
# per-line ignores rather than quick fixes; `invalid-ignore-comment` (cleared in
# gh#144) and the empty-body/parameter-already-assigned rules were the easy wins.
rules.call-non-callable = "ignore"  # 15 instances (remaining are None/object/str unions, not the analysis pipeline)
rules.invalid-argument-type = "ignore"  # 39 instances
rules.invalid-assignment = "ignore"  # 26 instances
rules.invalid-method-override = "ignore"  # 139 instances
rules.missing-argument = "ignore"  # 14 instances (mostly bound-method aliasing, see note)
rules.not-subscriptable = "ignore"  # 15 instances (mostly Optional-None attrs, see note)
rules.too-many-positional-arguments = "ignore"  # 26 instances
rules.unresolved-attribute = "ignore"  # 345 instances
rules.unresolved-import = "ignore"  # 45 instances
rules.unsupported-operator = "ignore"  # 26 instances

[tool.pytest]
# ==========================================================================
# pytest: migrated from setup.cfg's [tool:pytest] (see #125). pytest reads
# [tool.pytest.ini_options] here as the authoritative config.
# ==========================================================================
ini_options.minversion = "3.0"
ini_options.norecursedirs = [ ".hg", ".tox", "_build", "benchmark", "env*", "stress", "tmp*" ]
ini_options.python_files = [ "test_*.py" ]
ini_options.addopts = "-rs --tb=short"
# Registered so the marker resolves (and doesn't warn) even when
# pytest-run-parallel isn't installed -- e.g. serial dev runs. The plugin
# auto-detects thread-unsafe *fixtures* (capsys, monkeypatch, ...); this marker
# is for the handful of tests that mutate module/class globals or on-disk files
# *directly*, which auto-detection can't see. See the free-threading CI job.
ini_options.markers = [
  "thread_unsafe: test mutates shared global/on-disk state and must run serially under pytest-run-parallel",
]
# CPython 3.12+ raises a DeprecationWarning when fork() is used from a
# multi-threaded process. MpWriter uses the interpreter-default start method
# (fork on POSIX) unless the caller passes start_method="spawn"/"forkserver".
# That default-fork path is intentional and explicitly tested, so silence the
# advisory here rather than let it drown out actionable warnings. See #113.
ini_options.filterwarnings = [
  'ignore:This process .* is multi-threaded, use of fork\(\):DeprecationWarning',
]

[tool.coverage]
run.source = [ "src/whoosh" ]
